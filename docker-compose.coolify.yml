# Preset für Coolify (Build Pack "Docker Compose", Compose-Datei: /docker-compose.coolify.yml).
# Coolify setzt Traefik-Labels, Netzwerk und HTTPS selbst. Die Domain wird über
# SERVICE_FQDN_FRONTEND_80 vergeben und lässt sich in der Coolify-UI ändern.
# POSTGRES_PASSWORD und SECRET_KEY werden von Coolify automatisch generiert.
# TMDB__API_KEY und AUTH__ALLOWED_USERS müssen in der Coolify-UI gesetzt werden.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pmmx
      POSTGRES_USER: pmmx
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmmx"]
      interval: 5s
      timeout: 5s
      retries: 10

  pmmx:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      DATABASE__URL: postgresql+asyncpg://pmmx:${SERVICE_PASSWORD_POSTGRES}@db:5432/pmmx
      SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
      TMDB__API_KEY: ${TMDB__API_KEY:?TMDB__API_KEY in Coolify setzen}
      # Nur diese Plex-Nutzer (Benutzername oder E-Mail, kommagetrennt) dürfen sich anmelden.
      AUTH__ALLOWED_USERS: ${AUTH__ALLOWED_USERS:?AUTH__ALLOWED_USERS in Coolify setzen}
      STREAMING__API_KEY: ${STREAMING__API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - pmmx
    environment:
      - SERVICE_FQDN_FRONTEND_80

  # Nur intern erreichbar. In den App-Einstellungen als ntfy-URL http://ntfy:80 eintragen.
  ntfy:
    image: binwiederhier/ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy_data:/var/lib/ntfy

volumes:
  db_data:
  ntfy_data:
