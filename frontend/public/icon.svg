  <g clip-path="url(#lens)">
    <rect x="80" y="159" width="288" height="130" fill="#e5a00d"/>
    <g fill="#0f0f0f">
      <!-- Sprocket holes top -->
      <rect x="131" y="169" width="16" height="18" rx="4"/>
      <rect x="165" y="169" width="16" height="18" rx="4"/>
      <rect x="199" y="169" width="16" height="18" rx="4"/>
      <rect x="233" y="169" width="16" height="18" rx="4"/>
      <rect x="267" y="169" width="16" height="18" rx="4"/>
      <rect x="301" y="169" width="16" height="18" rx="4"/>
      <!-- Sprocket holes bottom -->
      <rect x="131" y="261" width="16" height="18" rx="4"/>
      <rect x="165" y="261" width="16" height="18" rx="4"/>
      <rect x="199" y="261" width="16" height="18" rx="4"/>
      <rect x="233" y="261" width="16" height="18" rx="4"/>
      <rect x="267" y="261" width="16" height="18" rx="4"/>
      <rect x="301" y="261" width="16" height="18" rx="4"/>
      <!-- Frames -->
      <rect x="115" y="195" width="66" height="58" rx="8"/>
      <rect x="191" y="195" width="66" height="58" rx="8"/>
      <rect x="267" y="195" width="66" height="58" rx="8"/>
