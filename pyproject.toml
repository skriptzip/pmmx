[project]
name = "pmmx"
version = "0.1.0"
description = "Plex Missing-Media-Scanner"
requires-python = ">=3.12"
dependencies = [
    "plexapi>=4.15",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "tmdbsimple>=2.9",
    "pyjwt>=2.9",
    "apscheduler[asyncio]>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
